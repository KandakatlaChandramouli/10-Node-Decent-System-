version: '3.8'

services:
  sovereign-mesh:
    build: .
    image: sovereign-node:latest
    deploy:
      replicas: 10
    environment:
      - JURISDICTION_CODE=AE-DU
    networks:
      - sovereign-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  sovereign-net:
    driver: bridge
