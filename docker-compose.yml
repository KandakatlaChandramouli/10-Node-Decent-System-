version: '3.8'

services:
  node-0:
    build: .
    container_name: sovereign-node-0
    environment:
      - NODE_ID=node-0
      - P2P_PORT=9090
      - METRICS_PORT=9095
      - PEERS=sovereign-node-1:9090,sovereign-node-2:9090
    ports:
      - "9090:9090"
      - "9095:9095"
    networks:
      sovereign-mesh:
        ipv4_address: 172.28.0.10

  node-1:
    build: .
